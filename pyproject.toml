[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aic-newton"
version = "0.1.0"
description = "Self-contained AIC cable simulation for Newton"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
    "newton==1.4.0",
    "pyglet>=2.1.6,<3",
    "imgui-bundle>=1.92.0",
    "mujoco==3.10.0",
    "mujoco-warp==3.10.0.3",
    "pycollada>=0.9",
    "trimesh>=4.0",
]

[project.scripts]
aic = "aic_newton.example:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aic_newton"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
